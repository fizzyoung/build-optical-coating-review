name: Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Create isolated installed copy
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "build-optical-coating-review"
          Copy-Item -Recurse -Force "build-optical-coating-review" $target
          "INSTALLED_SKILL_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run release regression
        run: python tests/build-optical-coating-review/run_regression.py --installed-skill-root "$env:INSTALLED_SKILL_ROOT"
